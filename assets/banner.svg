<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyan-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="chart-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".4"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1f2937" stroke-opacity=".6" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="24"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(-15px,20px);opacity:.55}}@keyframes pulseOrbPink{0%{transform:scale(1.1) translate(0,0);opacity:.25}50%{transform:scale(.95) translate(20px,-15px);opacity:.45}}@keyframes waveDash{0%{stroke-dashoffset:0}}@keyframes pulseDot{0%{r:5px;opacity:.7}50%{r:8px;opacity:1}}@keyframes pingRing{0%{r:6px;opacity:.9;stroke-width:2px}}.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:46px;fill:#fff;letter-spacing:-1px}.gradient-text{fill:url(#primary-grad)}.badge-text,.subtitle{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:400;font-size:19px;fill:#9ca3af;letter-spacing:.2px}.badge-text{font-weight:600;font-size:13px;fill:#e0e7ff}.orb-cyan{transform-origin:200px 100px;animation:pulseOrb 9s ease-in-out infinite}.orb-pink{transform-origin:1000px 300px;animation:pulseOrbPink 11s ease-in-out infinite}.live-stream{stroke-dasharray:8 6;animation:waveDash 18s linear infinite}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g><circle cx="220" cy="120" r="140" fill="#06b6d4" class="orb-cyan" filter="url(#glow)"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0.35;0.6;0.35"/></circle><circle cx="1020" cy="280" r="160" fill="#ec4899" class="orb-pink" filter="url(#glow)"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0.25;0.5;0.25"/></circle><circle cx="650" cy="380" r="180" fill="#6366f1" filter="url(#glow)" opacity=".2"/></g><g opacity=".35"><path fill="url(#chart-grad)" d="M 0,380 Q 200,240 400,310 T 800,260 T 1200,230 L 1200,420 L 0,420 Z"/><path fill="none" stroke="#6366f1" stroke-width="2.5" d="M 0,380 Q 200,240 400,310 T 800,260 T 1200,230" class="live-stream"/><path fill="none" stroke="#06b6d4" stroke-width="2" d="M 0,340 Q 250,290 500,210 T 950,280 T 1200,180" class="live-stream" opacity=".7"/></g><g transform="translate(800, 260)"><circle cx="0" cy="0" r="6" fill="none" stroke="#ec4899"><animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="6;22"/><animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.9;0"/></circle><circle cx="0" cy="0" r="5" fill="#ec4899"><animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="5;7.5;5"/></circle></g><g transform="translate(500, 210)"><circle cx="0" cy="0" r="6" fill="none" stroke="#06b6d4"><animate attributeName="r" begin="1.2s" dur="2.4s" repeatCount="indefinite" values="6;22"/><animate attributeName="opacity" begin="1.2s" dur="2.4s" repeatCount="indefinite" values="0.9;0"/></circle><circle cx="0" cy="0" r="5" fill="#06b6d4"><animate attributeName="r" begin="1.2s" dur="2.4s" repeatCount="indefinite" values="5;7.5;5"/></circle></g><g transform="translate(80, 75)"><rect width="210" height="32" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" rx="16"/><circle cx="18" cy="16" r="4" fill="#10b981"/><text x="32" y="21" fill="#c7d2fe" class="badge-text">CURATED DIRECTORY</text></g><text x="80" y="160" class="title">Awesome <tspan class="gradient-text">Digital Product Analytics</tspan></text><text x="80" y="208" class="subtitle">The ultimate curated guide to modern SaaS platforms, open-source engines,</text><text x="80" y="236" class="subtitle">session replays, event streams, pricing models &amp; market dynamics.</text><g><g transform="translate(80, 290) translate(0, 0)"><rect width="180" height="42" fill="#1f2937" stroke="#374151" stroke-width="1" rx="10"/><text x="18" y="26" class="badge-text">💼 SaaS &amp; Valuations</text></g><g transform="translate(80, 290) translate(195, 0)"><rect width="205" height="42" fill="#1f2937" stroke="#374151" stroke-width="1" rx="10"/><text x="18" y="26" class="badge-text">⭐ Top Open-Source (OSS)</text></g><g transform="translate(80, 290) translate(415, 0)"><rect width="215" height="42" fill="#1f2937" stroke="#374151" stroke-width="1" rx="10"/><text x="18" y="26" class="badge-text">🏷️ Pricing &amp; Free Tier Limits</text></g><g transform="translate(80, 290) translate(645, 0)"><rect width="180" height="42" fill="#1f2937" stroke="#374151" stroke-width="1" rx="10"/><text x="18" y="26" class="badge-text">📈 Market Intelligence</text></g></g></svg>