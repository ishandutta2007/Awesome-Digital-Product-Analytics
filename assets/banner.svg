<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1" stroke-opacity="0.6" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .gradient-text {
      fill: url(#primary-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #9ca3af;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }

    /* Pulse & Float Animations */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(-15px, 20px); opacity: 0.55; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    @keyframes pulseOrbPink {
      0% { transform: scale(1.1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(0.95) translate(20px, -15px); opacity: 0.45; }
      100% { transform: scale(1.1) translate(0, 0); opacity: 0.25; }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }
    @keyframes pulseDot {
      0%, 100% { r: 5px; opacity: 0.7; }
      50% { r: 8px; opacity: 1; }
    }
    @keyframes pingRing {
      0% { r: 6px; opacity: 0.9; stroke-width: 2px; }
      100% { r: 22px; opacity: 0; stroke-width: 0.5px; }
    }

    .orb-cyan {
      transform-origin: 200px 100px;
      animation: pulseOrb 9s ease-in-out infinite;
    }
    .orb-pink {
      transform-origin: 1000px 300px;
      animation: pulseOrbPink 11s ease-in-out infinite;
    }
    .live-stream {
      stroke-dasharray: 8 6;
      animation: waveDash 18s linear infinite;
    }
    .ping-circle {
      animation: pingRing 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .live-node {
      animation: pulseDot 2.4s ease-in-out infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Glow Orbs in Background -->
  <g>
    <circle class="orb-cyan" cx="220" cy="120" r="140" fill="#06b6d4" filter="url(#glow)" />
    <circle class="orb-pink" cx="1020" cy="280" r="160" fill="#ec4899" filter="url(#glow)" />
    <circle cx="650" cy="380" r="180" fill="#6366f1" filter="url(#glow)" opacity="0.2" />
  </g>

  <!-- Dynamic Analytics Wave Graph in Background (Subtle) -->
  <g opacity="0.35">
    <path d="M 0,380 Q 200,240 400,310 T 800,260 T 1200,230 L 1200,420 L 0,420 Z" fill="url(#chart-grad)" />
    <path class="live-stream" d="M 0,380 Q 200,240 400,310 T 800,260 T 1200,230" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <path class="live-stream" d="M 0,340 Q 250,290 500,210 T 950,280 T 1200,180" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.7" />
  </g>

  <!-- Live Pulse Node in background graph -->
  <g transform="translate(800, 260)">
    <circle class="ping-circle" cx="0" cy="0" r="6" stroke="#ec4899" fill="none" />
    <circle class="live-node" cx="0" cy="0" r="5" fill="#ec4899" />
  </g>
  <g transform="translate(500, 210)">
    <circle class="ping-circle" cx="0" cy="0" r="6" stroke="#06b6d4" fill="none" style="animation-delay: 1.2s;" />
    <circle class="live-node" cx="0" cy="0" r="5" fill="#06b6d4" style="animation-delay: 1.2s;" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(80, 75)">
    <rect width="210" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4" fill="#10b981" />
    <text x="32" y="21" class="badge-text" fill="#c7d2fe">CURATED DIRECTORY</text>
  </g>

  <!-- Main Headline Title (Foreground) -->
  <text x="80" y="160" class="title">
    Awesome <tspan class="gradient-text">Digital Product Analytics</tspan> 📊
  </text>

  <!-- Subtitle (Foreground) -->
  <text x="80" y="208" class="subtitle">
    The ultimate curated guide to modern SaaS platforms, open-source engines,
  </text>
  <text x="80" y="236" class="subtitle">
    session replays, event streams, pricing models &amp; market dynamics.
  </text>

  <!-- Feature Highlights / Tag Badges (Foreground) -->
  <g transform="translate(80, 290)">
    <!-- Badge 1: SaaS Benchmarks -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="18" y="26" class="badge-text">💼 SaaS &amp; Valuations</text>
    </g>

    <!-- Badge 2: Open Source -->
    <g transform="translate(195, 0)">
      <rect width="205" height="42" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="18" y="26" class="badge-text">⭐ Top Open-Source (OSS)</text>
    </g>

    <!-- Badge 3: Transparent Pricing -->
    <g transform="translate(415, 0)">
      <rect width="215" height="42" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="18" y="26" class="badge-text">🏷️ Pricing &amp; Free Tier Limits</text>
    </g>

    <!-- Badge 4: Market Research -->
    <g transform="translate(645, 0)">
      <rect width="180" height="42" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="18" y="26" class="badge-text">📈 Market Intelligence</text>
    </g>
  </g>
</svg>
